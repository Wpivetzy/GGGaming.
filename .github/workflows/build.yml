name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          F=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$F" ] && [ -f GGGaming.zip ]; then unzip -q GGGaming.zip -d _proj; F=$(find _proj -name settings.gradle.kts | head -1); fi
          if [ -z "$F" ]; then echo "settings.gradle.kts nao encontrado. Arquivos no repo:"; ls -R | head -50; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GG_Gaming.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GG_Gaming
          path: GG_Gaming.apk
